name: Daily BuzzerBeater update

on: # trigger reindex
  schedule:
    # 10:10 UTC daily - after the game's own weekly/daily rollovers, well
    # clear of the Monday economy-week and Friday training-week boundaries.
    - cron: # trigger reindex "10 10 * * *"
  workflow_dispatch: {}

jobs:
  update-sharpshooters:
    runs-on: # trigger reindex ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: # trigger reindex "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch live data and update report.db
        working-directory: scripts
        env:
          BB_LOGIN: ${{ secrets.BB_LOGIN }}
          BB_CODE: ${{ secrets.BB_CODE }}
        run: python update_db.py --config ../teams/sharpshooters.json --db ../docs/report.db

      - name: Commit updated database
        run: |
          git config user.name "buzzerbeater-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/report.db
          git diff --cached --quiet || git commit -m "Daily BuzzerBeater snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
